<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061a30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Sharks Ladder">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23061a30'/%3E%3Cpath d='M6 23 C12 20 16 13 20 6 C20 13 22 19 27 23 Z' fill='%2335c3f3'/%3E%3Cpath d='M4 25 q3 -2 6 0 t6 0 t6 0 t6 0' fill='none' stroke='%23ff9a1f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Southern Sharks Ladder</title>
<script>
/* Ask for a fresh copy of the app's files at most every five minutes, whatever the browser has cached,
   so a refresh on a phone or tablet picks up a new version and never mixes old and new files. */
var LADDER_V = "?v=" + Math.floor(Date.now() / 300000);
(function () { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = "styles.css" + LADDER_V; document.head.appendChild(l); })();
</script>
</head>
<body>
<div id="app"><p class="boot">Loading the league…</p></div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
["config.js", "core.js", "backend.js", "app.js"].forEach(function (f) { var s = document.createElement("script"); s.src = f + LADDER_V; s.async = false; document.body.appendChild(s); });
</script>
</body>
</html>
